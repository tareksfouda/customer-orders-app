version: '3.8'

services:
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-orders:
    image: postgres:15-alpine
    container_name: postgres-orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      JWT_SECRET: your-secret-key-change-this-in-production-min-32-chars
      JWT_EXPIRATION: 86400000
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDERS_SERVICE_URL: http://orders-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    depends_on:
      - auth-service
      - orders-service
      - inventory-service
    volumes:
      - ./api-gateway:/app

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: auth-service
      SERVER_PORT: 8081
      JWT_SECRET: your-secret-key-change-this-in-production-min-32-chars
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app

  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/orders_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: orders-service
      SERVER_PORT: 8082
      JWT_SECRET: your-secret-key-change-this-in-production-min-32-chars
      AUTH_SERVICE_URL: http://auth-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    depends_on:
      postgres-orders:
        condition: service_healthy
    volumes:
      - ./services/orders-service:/app

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: inventory-service
      SERVER_PORT: 8083
      JWT_SECRET: your-secret-key-change-this-in-production-min-32-chars
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres-inventory:
        condition: service_healthy
    volumes:
      - ./services/inventory-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer-orders-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_auth_data:
  postgres_orders_data:
  postgres_inventory_data:
